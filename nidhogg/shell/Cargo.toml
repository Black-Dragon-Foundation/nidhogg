[package]
name = "nhshell"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
description = "nhshell, Nidhogg's native Wayland shell layer (linked into Emacs through nidhogg/glue's libnhglue.a)"
publish = false

# an rlib only: nidhogg/glue's libnhglue.a is the one Rust static library Emacs links
[lib]
crate-type = ["rlib"]

[features]
default = ["wayland"]
# the Wayland backend (`mod wayland`) and its dependencies; off for the Android check
wayland = [
    "dep:wayland-client",
    "dep:wayland-cursor",
    "dep:wayland-backend",
    "dep:wayland-protocols",
    "dep:wayland-scanner",
    "dep:xkbcommon",
    "dep:rustix",
]
# the AppKit backend (`mod macos`, Naglfar); its crates are macOS-only target dependencies
macos = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-quartz-core",
    "svg",
]
# SVG through resvg (`mod svg`): pure Rust, so its tests also run on Linux (check.sh turns it on there)
svg = ["dep:resvg"]
# entry points that exist only for tests (the macOS rows' event injection and counters); the glue's test-hooks turns it on
test-hooks = []

[dependencies]
glitnir = { path = "../glitnir", version = "0.1.0" }
wayland-client = { version = "0.31", optional = true }
wayland-cursor = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"], optional = true }
wayland-scanner = { version = "0.31", optional = true }
xkbcommon = { version = "0.9", default-features = false, optional = true }
rustix = { version = "1", features = ["fs", "mm", "event", "pipe", "net", "process"], optional = true }
libc = "0.2"
# text and the system's fonts, as librsvg has them; no raster images inside SVG (their decoders would duplicate Glitnir's)
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"], optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true }
objc2-quartz-core = { version = "0.3", optional = true }

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
debug = 1
