[package]
name = "nh-recorder"
version = "0.1.0"
edition = "2021"
description = "A recording Wayland compositor for Nidhogg's client tests (test-only, not vendored)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "nh-recorder"
path = "src/main.rs"

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "renderer_pixman"] }
calloop = { version = "0.14", features = ["signals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xkbcommon = { version = "0.8", features = ["wayland"] }
png = "0.17"
# the xdg session-management protocol, which Smithay 0.7 lacks, is generated from protocols/ (src/extras.rs)
wayland-backend = "0.3"
wayland-scanner = "0.31"

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

[profile.release]
opt-level = 2
