# cargo-deny policy for the nh-recorder crate (test-only; nothing here ships).  Advisories are checked in CI only.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
]
# nh-recorder itself (publish = false) is GPL-3.0-or-later, Nidhogg's own licence
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
