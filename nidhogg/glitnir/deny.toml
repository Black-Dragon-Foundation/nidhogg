# cargo-deny policy for the glitnir crate.  Advisories are checked in CI only (they need the network).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
]
# the list is for dependencies: glitnir itself (publish = false) is GPL-3.0-or-later, Nidhogg's own licence
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
