[package]
name = "glitnir"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
description = "Glitnir, a small compositor library with a C ABI"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# The image decoders (feature `images`, README "Image decoders"): exact pins, no default features (gif: only
# `std`, without which the crate is empty).
png = { version = "=0.18.1", default-features = false, optional = true }
gif = { version = "=0.14.2", default-features = false, features = ["std"], optional = true }
image-webp = { version = "=0.2.4", default-features = false, optional = true }

[features]
default = ["images"]
images = ["dep:png", "dep:gif", "dep:image-webp"]
pixman-oracle = []

# The shadow tests convolve their reference images with an exact Gaussian (~10⁹ multiply-adds): optimised, they
# take a second; overflow checks stay on.
[profile.test]
opt-level = 2

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
debug = 1
