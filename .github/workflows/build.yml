# Nidhogg CI.  Every build goes through nidhogg/build.sh (podman containers on Linux, the host on macOS).  drgnx's tiers
# (its own drgnx-tiers.yml, called here) run against the built tarballs and gate the release job.  README.md, "CI and
# releases".
name: Nidhogg

on:
  push:
    branches: [nidhogg-31]
    tags: ["v*-nidhogg.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      drgnx_ref:
        description: "drgnx branch, tag or commit whose unit suite runs against the build (empty: the pinned commit)"
        default: ""
      scope:
        description: "full: every job; macos: the series rules and the macOS jobs only (between gates, Linux is tested locally)"
        type: choice
        options: [full, macos]
        default: full
      # A narrowed run (README.md, "Narrowed runs"): only the named jobs (and the jobs whose artifacts they take), only
      # the named checks or GUI lanes.  Its gate is "Nidhogg gate (partial)" whenever it left out a job the change
      # needs or narrowed the tests, so it never stands for a full run.
      jobs:
        description: "Narrowed: the jobs to run, space-separated ids from nidhogg/ci/paths.txt (empty: all)"
        default: ""
      checks:
        description: "Narrowed: the Linux builds' check targets instead of nidhogg/check-subset.txt (e.g. src/emacs-tests)"
        default: ""
      lanes:
        description: "Narrowed: the GUI lanes to run, space-separated (empty: every lane)"
        default: ""

# packages: the prebuilt CI images (the images job)
permissions:
  contents: read
  packages: read

# Which runs write caches (README.md, "Caches"), within the repository's 10 GB: nidhogg-31 every one; a pull request
# from a branch of this repository the small ones, the exact-key families (compiled Lisp, tarballs, configure's
# checks, the pinned packages) and ccache, not the large prefix-restored ones (the native crates' 1.2 GB, Glitnir's
# cargo targets), which it reads from nidhogg-31 anyway, and the pr-caches job keeps only its newest run's set; ci/*
# branches, a fork's pull request and a tag none (they restore only).  GitHub scopes a pull request's entries to its
# merge ref (refs/pull/N/merge): only that pull request's later runs read them, never nidhogg-31 or another branch.
# Every run reads its own ref's and nidhogg-31's.
env:
  CACHE_SAVE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/nidhogg-31') }}
  CACHE_SAVE_ALL: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/nidhogg-31' }}

concurrency:
  group: nidhogg-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # What the change can affect (nidhogg/ci/changes.sh over nidhogg/ci/paths.txt): a pull request runs only those
  # jobs, against a nidhogg-31 whose gate passed; every push, tag and dispatch that names nothing runs everything.
  # Anything uncertain runs everything.  The jobs below run unless it said false, so they run if it failed.
  changes:
    name: What the change can affect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      linux: ${{ steps.c.outputs.run_linux }}
      compile-noglitnir: ${{ steps.c.outputs.run_compile_noglitnir }}
      macos: ${{ steps.c.outputs.run_macos }}
      drgnx: ${{ steps.c.outputs.run_drgnx }}
      native-crates: ${{ steps.c.outputs.run_native_crates }}
      native-gui: ${{ steps.c.outputs.run_native_gui }}
      workers-harness: ${{ steps.c.outputs.run_workers_harness }}
      workers-asan: ${{ steps.c.outputs.run_workers_asan }}
      workers-chaos: ${{ steps.c.outputs.run_workers_chaos }}
      workers-pkg: ${{ steps.c.outputs.run_workers_pkg }}
      workers-pkg-compare: ${{ steps.c.outputs.run_workers_pkg_compare }}
      timing: ${{ steps.c.outputs.run_timing }}
      skip: ${{ steps.c.outputs.skip }}
      partial: ${{ steps.c.outputs.partial }}
      tiers: ${{ steps.t.outputs.tiers }}
      lanes: ${{ steps.t.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            nidhogg/ci
            nidhogg/test/native-gui.sh
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GATE: Nidhogg gate
          REQUEST: ${{ inputs.jobs || (inputs.scope == 'macos' && 'macos drgnx' || '') }}
          SELECTOR: ${{ inputs.checks }}${{ inputs.lanes && ' lanes:' || '' }}${{ inputs.lanes }}
        run: bash nidhogg/ci/changes.sh nidhogg/ci/paths.txt | tee -a "$GITHUB_OUTPUT"
      # drgnx's tiers on the tarballs this run builds, and the GUI lanes (every lane of native-gui.sh with a floor, or
      # the narrowed run's)
      - id: t
        env:
          LINUX: ${{ steps.c.outputs.run_linux }}
          MACOS: ${{ steps.c.outputs.run_macos }}
          LANES: ${{ inputs.lanes }}
        run: |
          t=""
          [ "$LINUX" = false ] || t="unit no-lisp-writes ui"
          [ "$MACOS" = false ] || t="${t:+$t }macos"
          echo "tiers=$t" | tee -a "$GITHUB_OUTPUT"
          all=$(sed -nE 's/^  ([a-z0-9-]+)\) +min=[1-9][0-9]*;.*/\1/p' nidhogg/test/native-gui.sh)
          want=$all
          if [ -n "$LANES" ]; then
            want=""
            for l in $LANES; do
              printf '%s\n' "$all" | grep -qx -- "$l" || { echo "::error::no GUI lane $l in nidhogg/test/native-gui.sh"; exit 1; }
              want="$want $l"
            done
          fi
          echo "lanes=$(echo "$want" | tr ' ' '\n' | jq -Rnc '[inputs | select(length > 0)]')" | tee -a "$GITHUB_OUTPUT"

  # The prebuilt images the Linux jobs run in (images.yml, nidhogg/ci/image.sh): each one's digest, published here for
  # a push to nidhogg-31 or a run by hand when its tag is missing; a pull request's run never publishes, and a job
  # whose image this left empty builds it for itself.  Not in the gate: it makes a cache, not a verdict.
  images:
    name: Images
    if: ${{ inputs.scope != 'macos' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  tree:
    name: Patch series rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y unifdef
      - run: TREE_TEST_SELF=1 bash nidhogg/test/tree-test.sh
      - run: bash nidhogg/test/tree-test.sh
      - run: bash nidhogg/test/ci-test.sh
      - run: bash nidhogg/test/check-rerun-test.sh
      - run: bash nidhogg/test/check-image-test.sh
      - run: bash nidhogg/test/preflight-test.sh
      - run: bash nidhogg/test/timing-lane.sh --self-test
      # the crates Glitnir's lock pins, as cargo downloaded them (the registry's index and .crate files only, never the
      # cargo home: no unpacked sources, no tools, no credentials), keyed on the lock
      - name: Glitnir's crates (same Cargo.lock)
        id: gcrates
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/glitnir-cargo/registry/index
            ${{ runner.temp }}/glitnir-cargo/registry/cache
          key: glitnir-crates-${{ hashFiles('nidhogg/glitnir/Cargo.lock') }}
      # Glitnir (the compositor): the crate's checks (fmt, clippy, tests, licences; the crates are fetched, locked) and the advisories.
      - name: Glitnir's checks
        env:
          CARGO_HOME: ${{ runner.temp }}/glitnir-cargo
        run: |
          sudo apt-get update && sudo apt-get install -y libpixman-1-dev
          d="cargo-deny-0.20.2-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/cd.tgz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$d.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cd.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/cd.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 "$d/cargo-deny"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          bash nidhogg/glitnir/check.sh
          cd nidhogg/glitnir && cargo deny check advisories
      - name: Save Glitnir's crates
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.gcrates.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/glitnir-cargo/registry/index
            ${{ runner.temp }}/glitnir-cargo/registry/cache
          key: glitnir-crates-${{ hashFiles('nidhogg/glitnir/Cargo.lock') }}

  # A pull request lands by fast-forwarding its base branch to its head, so every job checks out the head (not GitHub's
  # merge commit) and this one fails when the head does not descend from the base branch's tip: no fast-forward could
  # land it, and what the jobs tested is not what the merge would be.  Other events skip it.  The compare API answers
  # without a checkout (Emacs's history is large): its status is `ahead` or `identical` exactly when the base's tip is
  # an ancestor of the head.
  fast-forward:
    name: Pull request head fast-forwards its base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The base branch's tip is an ancestor of the head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tip=$(gh api "repos/$REPO/branches/$BASE_REF" --jq .commit.sha)
          read -r status ahead < <(gh api "repos/$REPO/compare/$tip...$HEAD_SHA" --jq '"\(.status) \(.ahead_by)"')
          case $status in
            ahead|identical) echo "$BASE_REF (${tip:0:12}) fast-forwards to ${HEAD_SHA:0:12}, $ahead commit(s)" ;;
            *) echo "::error::the head ${HEAD_SHA:0:12} does not descend from $BASE_REF's tip ${tip:0:12} (compare: $status): rebase it onto $BASE_REF"; exit 1 ;;
          esac

  linux:
    name: Linux (${{ matrix.distro }})
    needs: [changes, images]
    if: ${{ !cancelled() && inputs.scope != 'macos' && needs.changes.outputs.linux != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora-45, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Caches are restored before the build and saved right after it (actions/cache/save), not at the end of the job: a
      # later failing step (the tarball test) keeps what the build produced.  A run reads its own branch's entries and
      # nidhogg-31's (GitHub's scoping: never another branch's or a pull request's); which runs write which caches is
      # CACHE_SAVE and CACHE_SAVE_ALL above.  README.md, "Caches".
      - name: Source tree hash, compiled-Lisp inputs
        id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "abi=$(bash nidhogg/ci/lisp-key.sh --abi)" >> "$GITHUB_OUTPUT"
      # The built tarball, keyed by the exact source tree (git's tree hash of HEAD), the distro and build.sh: an
      # unchanged tree reuses its tarball (saved only after the build and Emacs's checks passed) and the tarball test, the
      # artifact upload and drgnx's suite still run.  Never for a release tag: a release is built fresh, so its BUILDINFO
      # names the tagged commit.
      - name: Built tarball (same tree, same build.sh)
        id: tb
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: tarball-${{ matrix.distro }}-${{ steps.tree.outputs.tree }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The cached tarball is intact
        if: ${{ steps.tb.outputs.cache-hit == 'true' }}
        run: cd dist && sha256sum -c -- *.sha256
      # every build.sh stage below runs in it and installs nothing (the build packages, ccache, gnutls-utils)
      - name: The build image
        id: img
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/nh-image
        with:
          name: build-${{ matrix.distro }}
          ref: ${{ matrix.distro == 'fedora-45' && needs.images.outputs.build_fedora_45 || needs.images.outputs.build_ubuntu_26_04 }}
          variable: NIDHOGG_BUILD_IMAGE
      # ccache for the C compile.  ccache hashes the preprocessed source and checks the compiler by content (build.sh), so
      # a restored entry can only be a correct one: it may come from any earlier run (a prefix match).  The key carries the
      # distro and the compiler's package set (gcc, from the build dependency list), then the run, so a rerun saves anew.
      - name: ccache (C objects)
        id: cc
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.distro }}-gcc-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.distro }}-gcc-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}-
      # The build's compiled Lisp (generated files under lisp/, .elc, .eln): exact key only.  The Lisp compile is the
      # dominant cost, the ccache above does not touch it, and a partly stale set would not be rebuilt correctly.  Keyed
      # on what Emacs's own .eln check hashes, not the C bodies (nidhogg/ci/lisp-key.sh --abi: the Lisp side, the
      # primitives' signatures, comp.c and the headers), the build image (gcc, libgccjit, the configuration), build.sh
      # (the configure flags) and the distro, so a change to a C body reuses it.  After make, build.sh's guard
      # (nidhogg/eln-guard.el) checks the restored .eln files against the new binary and builds the Lisp cold on a
      # mismatch; build.sh also refuses an entry made by another gcc or configure line.  Never restored for nidhogg-31 or a
      # release tag: their Lisp is compiled cold, so what ships and what the pull requests restore was never restored.
      - name: Compiled Lisp (same Lisp side and ABI)
        id: lc
        if: ${{ steps.tb.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/nidhogg-31' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-${{ matrix.distro }}-${{ steps.img.outputs.id }}-${{ steps.tree.outputs.abi }}-${{ hashFiles('nidhogg/build.sh') }}
      # autoconf's cache of configure's checks (build.sh, NIDHOGG_BUILD_CONFIG_CACHE): exact key only, on everything
      # configure is made from and runs with (configure.ac, m4/, build-aux/, autogen.sh, the version, build.sh's
      # flags, the build image's packages); a configure that fails with it runs again cold
      - name: Configure's checks (same configure inputs, same image)
        id: cf
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/config-cache
          key: configure-${{ matrix.distro }}-${{ steps.img.outputs.id }}-${{ hashFiles('configure.ac', 'm4/**', 'build-aux/**', 'autogen.sh', 'nidhogg/version', 'nidhogg/build.sh') }}
      # Glitnir's cargo target directory (the glue, the shell, Glitnir and their locked crates, with the registry's index
      # and downloaded .crate files; build.sh,
      # NIDHOGG_BUILD_CARGO_TARGET): keyed on the Cargo.lock files and the image (rustc), restored from the newest entry
      # of the same lock, as the native crates' are; cargo rebuilds what the file times below make stale
      - name: Glitnir's cargo target (same Cargo.lock files, same image)
        id: ct
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/glitnir-target
          key: glitnir-target-${{ matrix.distro }}-${{ steps.img.outputs.id }}-${{ hashFiles('nidhogg/glue/Cargo.lock', 'nidhogg/shell/Cargo.lock', 'nidhogg/glitnir/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: glitnir-target-${{ matrix.distro }}-${{ steps.img.outputs.id }}-${{ hashFiles('nidhogg/glue/Cargo.lock', 'nidhogg/shell/Cargo.lock', 'nidhogg/glitnir/Cargo.lock') }}-
      # each file's last commit time, and the files changed since the commit the cargo target was built from the
      # current time (set-mtimes.sh --since: a commit's time can be older than a target built from its parent)
      - name: File times (each file's last commit; what changed since the cargo target, now)
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        run: bash nidhogg/ci/set-mtimes.sh --since "$RUNNER_TEMP/glitnir-target/.nidhogg-source-commit"
      - name: Build
        id: build
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        env:
          NIDHOGG_BUILD_CCACHE: ${{ runner.temp }}/ccache
          NIDHOGG_BUILD_LISP_CACHE: ${{ runner.temp }}/lisp-cache
          NIDHOGG_BUILD_CONFIG_CACHE: ${{ runner.temp }}/config-cache
          NIDHOGG_BUILD_CARGO_TARGET: ${{ runner.temp }}/glitnir-target
        run: |
          bash nidhogg/build.sh --container "${{ matrix.distro }}" --stage build --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build"
      # saved right after the build, before Emacs's checks and the tarball; ccache also after a failed build (its
      # entries check themselves, and a red run is the one that runs again), the others only after a build that passed;
      # an entry whose exact key was found is not saved again
      - name: Save ccache
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cc.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.distro }}-gcc-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}-${{ github.run_id }}-${{ github.run_attempt }}
      # nidhogg-31 saves its cold build's (it restores none); a run whose image was built here saves none (local-RUN)
      - name: Save compiled Lisp
        if: ${{ always() && env.CACHE_SAVE == 'true' && steps.build.outcome == 'success' && !startsWith(steps.img.outputs.id, 'local-') && ((steps.lc.outcome == 'success' && steps.lc.outputs.cache-hit != 'true') || (steps.lc.outcome == 'skipped' && github.ref == 'refs/heads/nidhogg-31')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-${{ matrix.distro }}-${{ steps.img.outputs.id }}-${{ steps.tree.outputs.abi }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Save configure's checks
        if: ${{ always() && env.CACHE_SAVE == 'true' && steps.build.outcome == 'success' && steps.cf.outputs.cache-hit != 'true' && !startsWith(steps.img.outputs.id, 'local-') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/config-cache
          key: configure-${{ matrix.distro }}-${{ steps.img.outputs.id }}-${{ hashFiles('configure.ac', 'm4/**', 'build-aux/**', 'autogen.sh', 'nidhogg/version', 'nidhogg/build.sh') }}
      # nidhogg-31 only (about 0.2 GB per distro; a pull request restores nidhogg-31's), pruned of cargo's incremental
      # data; the entry names its commit only after a build that passed (build.sh)
      - name: Leave cargo's incremental data out of the cargo target
        if: ${{ always() && env.CACHE_SAVE_ALL == 'true' && steps.build.outcome == 'success' }}
        run: find "$RUNNER_TEMP/glitnir-target" -type d -name incremental -prune -exec rm -r {} + 2>/dev/null || true
      - name: Save Glitnir's cargo target
        if: ${{ always() && env.CACHE_SAVE_ALL == 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/glitnir-target
          key: glitnir-target-${{ matrix.distro }}-${{ steps.img.outputs.id }}-${{ hashFiles('nidhogg/glue/Cargo.lock', 'nidhogg/shell/Cargo.lock', 'nidhogg/glitnir/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      # the checks: nidhogg/check-subset.txt, or a narrowed run's targets
      - name: The check subset
        id: subset
        if: ${{ steps.build.outcome == 'success' }}
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          if [ -n "$CHECKS" ]; then echo "$CHECKS" | tr ' ' '\n' > "$RUNNER_TEMP/check-subset.txt"; else cp nidhogg/check-subset.txt "$RUNNER_TEMP/check-subset.txt"; fi
      # The tree-sitter grammars the workers' and treesit rows load (pinned commits, ABI checked), built on the runner
      # and mounted into the fedora-45 check container: without them every grammar row skips.  One leg is enough.
      - name: Test grammars (fedora-45)
        id: grammars
        if: ${{ matrix.distro == 'fedora-45' && steps.build.outcome == 'success' }}
        run: bash test/src/nidhogg-tests/fixtures/grammars.sh "$RUNNER_TEMP/grammars"
      - name: Emacs's checks (nidhogg/check-subset.txt)
        id: check
        if: ${{ steps.build.outcome == 'success' }}
        env:
          # gnutls-serv for the TLS rows (workers-tls-tests skip without it) and dbus-daemon for the settings tests'
          # private bus (they fail without it when CI is set); in the build image (else build.sh installs them with
          # dnf), so the fedora-45 leg only, as with the grammars
          NIDHOGG_CHECK_PACKAGES: ${{ matrix.distro == 'fedora-45' && 'gnutls-utils dbus-daemon' || '' }}
          NIDHOGG_TEST_GRAMMARS: ${{ steps.grammars.outcome == 'success' && '/grammars' || '' }}
          NIDHOGG_BUILD_PODMAN_ARGS: ${{ steps.grammars.outcome == 'success' && format('-v {0}/grammars:/grammars:ro,z', runner.temp) || '' }}
        run: bash nidhogg/build.sh --container "${{ matrix.distro }}" --stage check --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build" --check "$RUNNER_TEMP/check-subset.txt"
      - name: Write the tarball
        id: pack
        if: ${{ steps.check.outcome == 'success' }}
        run: |
          V=$(head -n 1 nidhogg/version)
          bash nidhogg/build.sh --container "${{ matrix.distro }}" --stage pack --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build" \
            --out "dist/nidhogg-$V-${{ matrix.distro }}-$(uname -m).tar.xz"
      # only a run with the whole check subset makes a tarball another run may take as checked, and on fedora-45 only
      # with the test grammars built (without them every grammar row skipped)
      - name: Save built tarball
        if: ${{ always() && env.CACHE_SAVE == 'true' && inputs.checks == '' && steps.pack.outcome == 'success' && (matrix.distro != 'fedora-45' || steps.grammars.outcome == 'success') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: tarball-${{ matrix.distro }}-${{ steps.tree.outputs.tree }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The tarball runs at its prefix and elsewhere
        run: bash nidhogg/test/tarball-test.sh dist/*.tar.xz "${{ matrix.distro }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.distro }}
          path: dist/
          if-no-files-found: error
      - name: Build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ matrix.distro }}
          path: ${{ runner.temp }}/build/*.log
          if-no-files-found: ignore

  # Glitnir (the compositor) is behind --with-glitnir: the tree still configures and compiles without it, with no
  # Rust installed (build.sh leaves cargo and rust out of the package list under --without-glitnir).  The shell needs
  # Glitnir, so this is a terminal-only build.
  compile-noglitnir:
    name: Compile without Glitnir (fedora-45)
    needs: [changes, images]
    if: ${{ !cancelled() && github.ref_type != 'tag' && needs.changes.outputs.compile-noglitnir != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # the build image without the Rust toolchain: the build has no Rust to find
      - name: The build image (no Rust)
        id: img
        uses: ./.github/actions/nh-image
        with:
          name: build-fedora-45-norust
          ref: ${{ needs.images.outputs.build_fedora_45_norust }}
          variable: NIDHOGG_BUILD_IMAGE
      # its own ccache (another configuration: no entry of the Linux jobs' would match)
      - name: ccache (C objects)
        id: cc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-fedora-45-noglitnir-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-fedora-45-noglitnir-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-
      - name: Compiled-Lisp inputs, file times (each file's last commit)
        id: tree
        run: |
          echo "abi=$(bash nidhogg/ci/lisp-key.sh --abi)" >> "$GITHUB_OUTPUT"
          bash nidhogg/ci/set-mtimes.sh
      # a dev build's compiled Lisp (its .elc and the preloaded files' .eln), keyed and guarded as the Linux jobs'
      - name: Compiled Lisp (same Lisp side and ABI)
        id: lc
        if: ${{ github.ref != 'refs/heads/nidhogg-31' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-fedora-45-noglitnir-${{ steps.img.outputs.id }}-${{ steps.tree.outputs.abi }}-${{ hashFiles('nidhogg/build.sh') }}
      # a dev build (build.sh --dev: only the preloaded Lisp native-compiled, the rest byte-compiled): it shows what this
      # job is for, that configure, the C side, the dump and the Lisp build without Glitnir and with no Rust installed,
      # in minutes; the AOT compile of every file is the Linux jobs' (the same Lisp)
      - name: Build
        id: build
        env:
          NIDHOGG_BUILD_CCACHE: ${{ runner.temp }}/ccache
          NIDHOGG_BUILD_LISP_CACHE: ${{ runner.temp }}/lisp-cache
        run: bash nidhogg/build.sh --container fedora-45 --without-glitnir --dev --stage build --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build"
      - name: Save ccache
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cc.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-fedora-45-noglitnir-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save compiled Lisp
        if: ${{ always() && env.CACHE_SAVE == 'true' && steps.build.outcome == 'success' && !startsWith(steps.img.outputs.id, 'local-') && ((steps.lc.outcome == 'success' && steps.lc.outputs.cache-hit != 'true') || (steps.lc.outcome == 'skipped' && github.ref == 'refs/heads/nidhogg-31')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-fedora-45-noglitnir-${{ steps.img.outputs.id }}-${{ steps.tree.outputs.abi }}-${{ hashFiles('nidhogg/build.sh') }}

  macos:
    name: macOS (NS app)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # the same caches and keys as the Linux jobs (see there), saved right after the step that produced them
      - name: Source tree hash, compiled-Lisp inputs
        id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "abi=$(bash nidhogg/ci/lisp-key.sh --abi)" >> "$GITHUB_OUTPUT"
      - name: Built tarball (same tree, same build.sh)
        id: tb
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: tarball-macos-${{ runner.arch }}-${{ steps.tree.outputs.tree }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The cached tarball is intact
        if: ${{ steps.tb.outputs.cache-hit == 'true' }}
        run: shasum -a 256 -c dist/*.sha256
      # Homebrew's packages, downloaded each run (a 775 MB cache of the bottles saved under a minute); Rust from the
      # image's rustup instead of Homebrew's when the image has it (Homebrew's otherwise)
      - name: Build dependencies (Homebrew; Rust by rustup)
        id: brew
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        run: |
          if command -v rustup >/dev/null; then
            sed 's/#.*//' nidhogg/deps/macos.build | grep -vx 'rust' | xargs brew install
            rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
            rustup default stable
          else
            sed 's/#.*//' nidhogg/deps/macos.build | xargs brew install
          fi
          rustc -V
      # Glitnir (the compositor): the crate's tests with the host's Rust (cargo, clippy, rustfmt; no pixman, the oracle is
      # Linux only; no cargo-deny, check.sh skips the licence check without it), so the aarch64 NEON baseline kernels are
      # tested somewhere.  Skipped with the build when the tarball for this tree is cached (it was built after these passed).
      # the locked crates it fetches: the registry's index and .crate files only, keyed on the lock
      - name: Glitnir's crates (same Cargo.lock)
        id: gcrates
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
          key: glitnir-crates-macos-${{ hashFiles('nidhogg/glitnir/Cargo.lock') }}
      - name: Glitnir's checks
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: bash nidhogg/glitnir/check.sh
      - name: Save Glitnir's crates
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.tb.outputs.cache-hit != 'true' && steps.gcrates.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cargo-home/registry/index
            ${{ runner.temp }}/cargo-home/registry/cache
          key: glitnir-crates-macos-${{ hashFiles('nidhogg/glitnir/Cargo.lock') }}
      # compiled Lisp: also keyed by the installed gcc and libgccjit versions and the build path (.eln names embed it)
      # (the image's version too: the C compiler is Xcode's clang, which ccache checks by its -v output)
      - name: Toolchain versions
        id: tc
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        run: |
          echo "v=$(brew list --versions gcc libgccjit | tr ' \n' '--')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          # what configure's checks find: every installed build package's version, and the image (Xcode)
          echo "deps=$(sed 's/#.*//' nidhogg/deps/macos.build | { xargs brew list --versions 2>/dev/null || true; } | { cat; echo "$ImageOS-$ImageVersion"; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "rust=$(rustc -V | tr ' ()' '-__')" >> "$GITHUB_OUTPUT"
      # keyed as the Linux jobs' (--abi; the guard after make), never restored for nidhogg-31 or a tag
      - name: Compiled Lisp (same Lisp side and ABI)
        id: lc
        if: ${{ steps.tb.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/nidhogg-31' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-macos-${{ runner.arch }}-${{ steps.tc.outputs.v }}-${{ runner.temp }}-${{ steps.tree.outputs.abi }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: ccache (Homebrew)
        id: ccb
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        run: brew install ccache
      - name: ccache (C objects)
        id: cc
        if: ${{ steps.ccb.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ runner.arch }}-${{ steps.tc.outputs.image }}-${{ hashFiles('nidhogg/deps/macos.build') }}-${{ github.run_id }}-${{ github.run_attempt }}
          # a new runner image falls back to the previous image's entry: ccache checks Xcode's clang by its -v output
          # (CCACHE_COMPILERCHECK, build.sh), so a changed compiler misses and an unchanged one still hits
          restore-keys: |
            ccache-macos-${{ runner.arch }}-${{ steps.tc.outputs.image }}-${{ hashFiles('nidhogg/deps/macos.build') }}-
            ccache-macos-${{ runner.arch }}-
      # configure's checks and Glitnir's cargo target, as the Linux jobs' (keyed on the packages' versions and the image,
      # and on the Cargo.lock files and rustc)
      - name: Configure's checks (same configure inputs, same packages)
        id: cf
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/config-cache
          key: configure-macos-${{ runner.arch }}-${{ steps.tc.outputs.deps }}-${{ hashFiles('configure.ac', 'm4/**', 'build-aux/**', 'autogen.sh', 'nidhogg/version', 'nidhogg/build.sh') }}
      - name: Glitnir's cargo target (same Cargo.lock, same rustc)
        id: ct
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/glitnir-target
          key: glitnir-target-macos-${{ runner.arch }}-${{ steps.tc.outputs.rust }}-${{ hashFiles('nidhogg/glitnir/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: glitnir-target-macos-${{ runner.arch }}-${{ steps.tc.outputs.rust }}-${{ hashFiles('nidhogg/glitnir/Cargo.lock') }}-
      - name: File times (each file's last commit; what changed since the cargo target, now)
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        run: bash nidhogg/ci/set-mtimes.sh --since "$RUNNER_TEMP/glitnir-target/.nidhogg-source-commit"
      - name: Build
        id: build
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        env:
          NIDHOGG_BUILD_CONFIG_CACHE: ${{ runner.temp }}/config-cache
          NIDHOGG_BUILD_CARGO_TARGET: ${{ runner.temp }}/glitnir-target
          NIDHOGG_BUILD_LISP_CACHE: ${{ runner.temp }}/lisp-cache
          NIDHOGG_BUILD_CCACHE: ${{ steps.ccb.outcome == 'success' && format('{0}/ccache', runner.temp) || '' }}
        run: /bin/bash nidhogg/build.sh --host --stage build --jobs 3 --build-dir "$RUNNER_TEMP/build"
      - name: Save ccache
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cc.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ runner.arch }}-${{ steps.tc.outputs.image }}-${{ hashFiles('nidhogg/deps/macos.build') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save compiled Lisp
        if: ${{ always() && env.CACHE_SAVE == 'true' && steps.build.outcome == 'success' && ((steps.lc.outcome == 'success' && steps.lc.outputs.cache-hit != 'true') || (steps.lc.outcome == 'skipped' && github.ref == 'refs/heads/nidhogg-31')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-macos-${{ runner.arch }}-${{ steps.tc.outputs.v }}-${{ runner.temp }}-${{ steps.tree.outputs.abi }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Save configure's checks
        if: ${{ always() && env.CACHE_SAVE == 'true' && steps.build.outcome == 'success' && steps.cf.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/config-cache
          key: configure-macos-${{ runner.arch }}-${{ steps.tc.outputs.deps }}-${{ hashFiles('configure.ac', 'm4/**', 'build-aux/**', 'autogen.sh', 'nidhogg/version', 'nidhogg/build.sh') }}
      - name: Leave cargo's incremental data out of the cargo target
        if: ${{ always() && env.CACHE_SAVE_ALL == 'true' && steps.build.outcome == 'success' }}
        run: find "$RUNNER_TEMP/glitnir-target" -type d -name incremental -prune -exec rm -r {} + 2>/dev/null || true
      - name: Save Glitnir's cargo target
        if: ${{ always() && env.CACHE_SAVE_ALL == 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/glitnir-target
          key: glitnir-target-macos-${{ runner.arch }}-${{ steps.tc.outputs.rust }}-${{ hashFiles('nidhogg/glitnir/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Write the tarball
        id: pack
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          V=$(head -n 1 nidhogg/version)
          /bin/bash nidhogg/build.sh --host --stage pack --jobs 3 --build-dir "$RUNNER_TEMP/build" --out "dist/nidhogg-$V-macos-$(uname -m).tar.xz"
      - name: Save built tarball
        if: ${{ always() && env.CACHE_SAVE == 'true' && inputs.checks == '' && steps.pack.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: tarball-macos-${{ runner.arch }}-${{ steps.tree.outputs.tree }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The tarball runs unpacked
        run: bash nidhogg/test/tarball-test.sh dist/*.tar.xz macos
      # the workers batch files of nidhogg/check-subset.txt (or of a narrowed run's targets); a cached tarball has no
      # build tree to check
      - name: Workers checks (nidhogg/check-subset.txt, workers-* files)
        if: ${{ steps.build.outcome == 'success' }}
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          if [ -n "$CHECKS" ]; then echo "$CHECKS" | tr ' ' '\n'; else cat nidhogg/check-subset.txt; fi | grep 'nidhogg-tests/workers-' > "$RUNNER_TEMP/macos-subset.txt" || true
          [ -s "$RUNNER_TEMP/macos-subset.txt" ] || { echo "no workers files among the checks"; exit 0; }
          /bin/bash nidhogg/build.sh --host --stage check --jobs 3 --build-dir "$RUNNER_TEMP/build" --check "$RUNNER_TEMP/macos-subset.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-macos
          path: dist/
          if-no-files-found: error
      - name: Build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-macos
          path: ${{ runner.temp }}/build/*.log
          if-no-files-found: ignore

  # drgnx's Emacs-side tiers on the tarballs this run built, through drgnx's own definition of them
  # (.github/workflows/drgnx-tiers.yml in drgnx), called at a pinned drgnx commit, so a drgnx push never turns Nidhogg
  # red.  The uses line below is the one place the pin lives: GitHub allows no expression there, so the pin job reads
  # the SHA from it and the default drgnx_ref is that output.  Bump the uses line by hand to a drgnx commit whose CI is
  # green, and pass drgnx_ref by hand for a joint round (README.md, "CI and releases").  The
  # unit suite and gate mode on the fedora-45 tarball, the GUI tier on it under headless mutter, the unit suite on the
  # macOS tarball (only that one in scope=macos).  It runs once the builds are done, whatever they did: a job whose
  # tarball is missing fails by itself.
  pin:
    name: drgnx pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: The drgnx commit the uses line pins
        id: pin
        run: |
          ref=$(grep -oE '^ {4}uses:[ ]Black-Dragon-Foundation/drgnx/\.github/workflows/drgnx-tiers\.yml@[0-9a-f]{40}' .github/workflows/build.yml | sed 's/.*@//')
          [ -n "$ref" ] || { echo "no pinned drgnx-tiers.yml in build.yml" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  # The tiers are those whose tarball this run builds (the changes job's tiers: a run that builds only on macOS runs
  # only the macOS tier).
  drgnx:
    name: drgnx tiers
    needs: [changes, pin, linux, macos]
    if: ${{ !cancelled() && needs.changes.outputs.drgnx != 'false' }}
    permissions:
      contents: read
      packages: read
    uses: Black-Dragon-Foundation/drgnx/.github/workflows/drgnx-tiers.yml@a49e9fd3864d0568b011c7a9d9b620a6a43716ac # drgnx pin
    with:
      drgnx_ref: ${{ inputs.drgnx_ref || needs.pin.outputs.ref }}
      nidhogg: artifact
      tiers: ${{ inputs.scope == 'macos' && 'macos' || needs.changes.outputs.tiers || 'unit no-lisp-writes ui macos' }}

  # The native Wayland shell's own checks, both in release's needs and both run for a tag.  native-crates: the recorder,
  # then the crates' checks, which need it: their T1 tests run against it, and nothing else in this workflow runs them
  # (the build compiles the crates, and only Glitnir's checks run in tree).
  native-crates:
    name: Native shell crates (recorder, shell, glue)
    needs: [changes, images]
    if: ${{ !cancelled() && inputs.scope != 'macos' && needs.changes.outputs.native-crates != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # the three check.sh containers run in the build image, which has their packages
      - name: The build image
        uses: ./.github/actions/nh-image
        with:
          name: build-fedora-45
          ref: ${{ needs.images.outputs.build_fedora_45 }}
          variable: NIDHOGG_CRATES_IMAGE
      # the crates' target directories and their downloaded crates (the registry's index and .crate files, locked by the
      # Cargo.lock files this entry is keyed on), never whole cargo homes: no unpacked sources, no tools, no credentials.  Cargo
      # checks every restored artifact against its inputs' mtimes, which set-mtimes.sh below makes right, so an entry
      # from any earlier run is safe: restore-keys
      - name: Cargo (recorder, shell, glue)
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/nh-recorder-cargo/registry/index
            ${{ runner.temp }}/nh-recorder-cargo/registry/cache
            ${{ runner.temp }}/nhshell-cargo/crates/registry/index
            ${{ runner.temp }}/nhshell-cargo/crates/registry/cache
            ${{ runner.temp }}/nhglue-cargo/crates/registry/index
            ${{ runner.temp }}/nhglue-cargo/crates/registry/cache
            ${{ runner.temp }}/nh-recorder-target
            ${{ runner.temp }}/nhshell-cargo/target
            ${{ runner.temp }}/nhglue-cargo/target
          key: crates-fedora-45-${{ hashFiles('nidhogg/test/recorder/Cargo.lock', 'nidhogg/shell/Cargo.lock', 'nidhogg/glue/Cargo.lock', 'nidhogg/glitnir/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: crates-fedora-45-${{ hashFiles('nidhogg/test/recorder/Cargo.lock', 'nidhogg/shell/Cargo.lock', 'nidhogg/glue/Cargo.lock', 'nidhogg/glitnir/Cargo.lock') }}-
      # each file's last commit time, so cargo finds the files this change did not touch older than the restored targets;
      # the files changed since the commit the entry was built from (it names it) get the current time, since a commit's
      # time can be older than a cache built from its parent
      - name: File times (each file's last commit; what changed since the cache, now)
        run: bash nidhogg/ci/set-mtimes.sh --since "$RUNNER_TEMP/nh-recorder-target/.nidhogg-source-commit"
      - id: recorder
        run: T="$RUNNER_TEMP" bash nidhogg/test/recorder/check.sh --container fedora-45 --build
      - id: shell
        run: T="$RUNNER_TEMP" NH_RECORDER="$RUNNER_TEMP/nh-recorder-target/release/nh-recorder" bash nidhogg/shell/check.sh --container fedora-45
      - id: glue
        run: T="$RUNNER_TEMP" NH_RECORDER="$RUNNER_TEMP/nh-recorder-target/release/nh-recorder" bash nidhogg/glue/check.sh --container fedora-45
      # saved after the checks whatever they said (a red run is the one that runs again); incremental data is left
      # out: it only speeds up rebuilding the crates themselves, which a change to them does anyway.  The entry names
      # the commit it was built from (set-mtimes.sh --since), and only when all three checks passed: a red check may
      # have left a target unbuilt, which would then pass for HEAD's.  Otherwise the name it was restored with stays
      # (or none), so the next run's diff also covers what this one did not build.  A pull request does not save this
      # 1.2 GB entry: it restores nidhogg-31's by prefix.
      - name: Leave cargo's incremental data out of the cache
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && github.event_name != 'pull_request' && steps.recorder.outcome != 'skipped' }}
        env:
          BUILT: ${{ steps.recorder.outcome == 'success' && steps.shell.outcome == 'success' && steps.glue.outcome == 'success' }}
        run: |
          find "$RUNNER_TEMP"/nh-recorder-target "$RUNNER_TEMP"/nhshell-cargo "$RUNNER_TEMP"/nhglue-cargo -type d -name incremental -prune -exec rm -r {} + 2>/dev/null || true
          if [ "$BUILT" = true ]; then git rev-parse HEAD > "$RUNNER_TEMP/nh-recorder-target/.nidhogg-source-commit"; fi
      - if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && github.event_name != 'pull_request' && steps.recorder.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/nh-recorder-cargo/registry/index
            ${{ runner.temp }}/nh-recorder-cargo/registry/cache
            ${{ runner.temp }}/nhshell-cargo/crates/registry/index
            ${{ runner.temp }}/nhshell-cargo/crates/registry/cache
            ${{ runner.temp }}/nhglue-cargo/crates/registry/index
            ${{ runner.temp }}/nhglue-cargo/crates/registry/cache
            ${{ runner.temp }}/nh-recorder-target
            ${{ runner.temp }}/nhshell-cargo/target
            ${{ runner.temp }}/nhglue-cargo/target
          key: crates-fedora-45-${{ hashFiles('nidhogg/test/recorder/Cargo.lock', 'nidhogg/shell/Cargo.lock', 'nidhogg/glue/Cargo.lock', 'nidhogg/glitnir/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nh-recorder
          path: ${{ runner.temp }}/nh-recorder-target/release/nh-recorder
          if-no-files-found: error

  # GUI tests (test/src/nidhogg-tests/*-gui-tests.el) on the fedora-45 tarball, in a fedora-45 container with its own
  # session bus, one job per lane of nidhogg/test/native-gui.sh, which fails a lane that ran too few rows.  The lanes are
  # the script's own (every lane with a floor, read by the changes job), or a narrowed run's.
  native-gui:
    name: GUI rows (${{ matrix.lane }})
    needs: [changes, images, linux, native-crates]
    if: ${{ !cancelled() && inputs.scope != 'macos' && needs.changes.outputs.native-gui != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.changes.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: dl
        continue-on-error: true
        with:
          name: tarball-fedora-45
          path: dist
      - name: The fedora-45 build made a tarball
        if: ${{ steps.dl.outcome == 'failure' }}
        run: |
          echo "::error::no tarball: the fedora-45 build job failed (see the Linux fedora-45 job), so there is nothing to test"
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nh-recorder
          path: recorder
      - name: Unpack
        run: |
          mkdir -p "$RUNNER_TEMP/nidhogg"
          tar -xJf dist/*.tar.xz -C "$RUNNER_TEMP/nidhogg" --strip-components=1
          chmod +x recorder/nh-recorder
      # gui.sh's packages for every lane but KWin's and the input methods' extras, which gui.sh adds
      - name: The GUI image
        uses: ./.github/actions/nh-image
        with:
          name: gui-fedora-45
          ref: ${{ needs.images.outputs.gui_fedora_45 }}
          variable: GLITNIR_GUI_IMAGE
      # KWin 6.8 composites only on a render device.  It gets its software one, Mesa's llvmpipe over /dev/udmabuf, and no
      # DRM device (gui.sh): the same renderer on every runner.  vgem's render node composited on Azure's runners and not
      # on an AWS one (2026-11-05, kernel 7.0.0-1014-aws, whose first DRM device is a simpledrm framebuffer).  The
      # runners' kernels build udmabuf in (CONFIG_UDMABUF=y in linux-modules-7.0.0-1014-aws and -1017-azure), so no
      # module is loaded; the device is root's, and the container's root is the runner's user
      - name: KWin's software render device (/dev/udmabuf; Mesa's llvmpipe draws)
        if: ${{ matrix.lane == 'kwin' }}
        run: |
          [ -c /dev/udmabuf ] || { echo "::error::no /dev/udmabuf on kernel $(uname -r) (CONFIG_UDMABUF): KWin has no render device, so the kwin lane cannot run on this runner image"; exit 1; }
          sudo chmod 666 /dev/udmabuf
          echo "kernel $(uname -r); $(ls -l /dev/udmabuf)"
      - run: bash nidhogg/test/native-gui.sh "${{ matrix.lane }}" --prefix "$RUNNER_TEMP/nidhogg" --recorder "$PWD/recorder/nh-recorder" --container fedora-45

  # The off-main-thread work's CI (engine C, PD-4).  They run once the Linux builds are done, whatever the other distros
  # did, and they are not in release's needs: the default-on rule requires them green on the gate commit, a release
  # does not wait for them.  None of them has fail-fast.  Like compile-noglitnir, none runs for a release tag:
  # the tagged commit passed them in its round (README.md, "CI and releases").
  workers-harness:
    name: Workers C harness (TSan, fuzz)
    needs: [changes, images, linux]
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' && needs.changes.outputs.workers-harness != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: The build image
        uses: ./.github/actions/nh-image
        with:
          name: build-fedora-45
          ref: ${{ needs.images.outputs.build_fedora_45 }}
          variable: HARNESS_IMAGE
      # diffutils: the base image has no cmp, which the harness's selftest compares two runs with (the build image has
      # every package here: nothing is installed)
      - name: ThreadSanitizer drivers and fuzz targets, in a fedora-45 container
        run: |
          podman run --rm --memory 8g --memory-swap 8g -v "$PWD:/src:ro,Z" "$HARNESS_IMAGE" bash -euo pipefail -c '
            want="gcc libtsan libasan libubsan libpng-devel libjpeg-turbo-devel giflib-devel libwebp-devel diffutils"
            rpm -q --quiet --whatprovides $want || dnf -y -q --setopt=install_weak_deps=False install $want >/dev/null
            cd /src
            bash nidhogg/test/workers-harness.sh
            bash nidhogg/test/workers-harness.sh --tsan $(cd test/src/nidhogg-tests/fuzz && ls tsan-*.c | sed "s/^tsan-//; s/[.]c$//")
            bash nidhogg/test/workers-harness.sh --sched --exhaustive selftest queue wake
            bash nidhogg/test/workers-harness.sh --fuzz 60'

  workers-asan:
    name: Workers batch files (ASan + UBSan dev build)
    needs: [changes, images, linux]
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' && needs.changes.outputs.workers-asan != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Every workers-*-tests batch file but the timing and GUI groups
        run: |
          ls test/src/nidhogg-tests/workers-*-tests.el | sed 's|^test/||; s|[.]el$||' | grep -v -e -timing- -e -gui- > "$RUNNER_TEMP/asan-subset.txt"
          cat "$RUNNER_TEMP/asan-subset.txt"
      - name: The build image
        uses: ./.github/actions/nh-image
        with:
          name: build-fedora-45
          ref: ${{ needs.images.outputs.build_fedora_45 }}
          variable: NIDHOGG_BUILD_IMAGE
      # the Linux jobs' caches in this build's own entries (another configuration: --dev, the sanitizers), keyed as
      # there; build.sh stamps a compiled-Lisp entry with the mode, so a dev entry never meets a release build.  The
      # compiled Lisp is two entries: the byte-compiled part keyed on the Lisp side and the C side's names (lisp-key.sh
      # --elc), the .eln files on everything, so a change in a C body no longer makes the sanitized Emacs byte-compile
      # all of lisp/ again (some 1,500 files, most of the build's time).  A trade-off for this test lane, never for a
      # release build: byte code that folds a C function's result at compile time keeps the old body's result
      # until the Lisp side changes
      - name: Compiled-Lisp inputs, file times
        id: tree
        run: |
          echo "lisp=$(bash nidhogg/ci/lisp-key.sh)" >> "$GITHUB_OUTPUT"
          echo "elc=$(bash nidhogg/ci/lisp-key.sh --elc)" >> "$GITHUB_OUTPUT"
          bash nidhogg/ci/set-mtimes.sh
      - name: ccache (C objects)
        id: cc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-fedora-45-asan-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-fedora-45-asan-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-
      - name: Byte-compiled Lisp (same Lisp sources)
        id: lc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lisp-cache/src
            ${{ runner.temp }}/lisp-cache/stamp
          key: lisp-fedora-45-asan-elc-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ steps.tree.outputs.elc }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Native-compiled Lisp (same Lisp and C sources)
        id: ln
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache/obj
          key: lisp-fedora-45-asan-eln-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ steps.tree.outputs.lisp }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: "Build and run (the 100 MB-class rows are sized down: nidhogg-workers--test-size-scale)"
        id: build
        env:
          NIDHOGG_BUILD_SANITIZE: address,undefined
          NIDHOGG_WORKERS_TEST_SIZE_SCALE: "0.1"
          NIDHOGG_BUILD_CCACHE: ${{ runner.temp }}/ccache
          NIDHOGG_BUILD_LISP_CACHE: ${{ runner.temp }}/lisp-cache
        run: |
          bash nidhogg/build.sh --container fedora-45 --dev --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build-asan" \
            --check "$RUNNER_TEMP/asan-subset.txt"
      # after the run whatever the checks said: ccache always, the compiled Lisp once make wrote it (its stamp)
      - name: Save ccache
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cc.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-fedora-45-asan-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Did make write the compiled Lisp
        id: lcok
        if: ${{ !cancelled() && steps.lc.outcome == 'success' }}
        run: if [ -f "$RUNNER_TEMP/lisp-cache/stamp" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save byte-compiled Lisp
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.lcok.outputs.ok == 'true' && steps.lc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lisp-cache/src
            ${{ runner.temp }}/lisp-cache/stamp
          key: lisp-fedora-45-asan-elc-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ steps.tree.outputs.elc }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Save native-compiled Lisp
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.lcok.outputs.ok == 'true' && steps.ln.outcome == 'success' && steps.ln.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache/obj
          key: lisp-fedora-45-asan-eln-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ steps.tree.outputs.lisp }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-workers-asan
          path: ${{ runner.temp }}/build-asan/*.log
          if-no-files-found: ignore

  # The workers files under chaos (README.md, "CI and releases"): a chaos build (build.sh --dev --chaos: seeded delays at
  # the workers' sync points, src/nidhogg-chaos.h), then nidhogg/test/chaos-lane.sh runs the files of
  # nidhogg/test/chaos-files.txt once per seed, 1 to 5, and lets no rerun off: a red under chaos is a race.  A red names
  # its seed and the line that replays it.  Its own caches, keyed as workers-asan's (another configuration).  It needs
  # no tarball, so it runs beside the Linux builds, not after them.
  workers-chaos:
    name: Workers files under chaos (seeds 1-5)
    needs: [changes, images]
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' && needs.changes.outputs.workers-chaos != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: The build image
        uses: ./.github/actions/nh-image
        with:
          name: build-fedora-45
          ref: ${{ needs.images.outputs.build_fedora_45 }}
          variable: NIDHOGG_BUILD_IMAGE
      - name: Compiled-Lisp inputs, file times
        id: tree
        run: |
          echo "lisp=$(bash nidhogg/ci/lisp-key.sh)" >> "$GITHUB_OUTPUT"
          echo "elc=$(bash nidhogg/ci/lisp-key.sh --elc)" >> "$GITHUB_OUTPUT"
          bash nidhogg/ci/set-mtimes.sh
      - name: ccache (C objects)
        id: cc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-fedora-45-chaos-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-fedora-45-chaos-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-
      # the compiled Lisp as two entries, as in workers-asan
      - name: Byte-compiled Lisp (same Lisp sources)
        id: lc
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lisp-cache/src
            ${{ runner.temp }}/lisp-cache/stamp
          key: lisp-fedora-45-chaos-elc-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ steps.tree.outputs.elc }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Native-compiled Lisp (same Lisp and C sources)
        id: ln
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache/obj
          key: lisp-fedora-45-chaos-eln-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ steps.tree.outputs.lisp }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The chaos build
        id: build
        env:
          NIDHOGG_BUILD_CCACHE: ${{ runner.temp }}/ccache
          NIDHOGG_BUILD_LISP_CACHE: ${{ runner.temp }}/lisp-cache
        run: bash nidhogg/build.sh --container fedora-45 --dev --chaos --stage build --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build-chaos"
      - name: Save ccache
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.cc.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-fedora-45-chaos-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save byte-compiled Lisp
        if: ${{ always() && env.CACHE_SAVE == 'true' && steps.build.outcome == 'success' && steps.lc.outcome == 'success' && steps.lc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lisp-cache/src
            ${{ runner.temp }}/lisp-cache/stamp
          key: lisp-fedora-45-chaos-elc-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ steps.tree.outputs.elc }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Save native-compiled Lisp
        if: ${{ always() && env.CACHE_SAVE == 'true' && steps.build.outcome == 'success' && steps.ln.outcome == 'success' && steps.ln.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache/obj
          key: lisp-fedora-45-chaos-eln-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ steps.tree.outputs.lisp }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The workers files, seeds 1 to 5, no rerun (nidhogg/test/chaos-files.txt)
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          bash nidhogg/test/chaos-lane.sh --build-dir "$RUNNER_TEMP/build-chaos" --seeds "1 2 3 4 5" -- \
            bash nidhogg/build.sh --container fedora-45 --dev --chaos --memory 12g --jobs 4
      - name: Build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-workers-chaos
          path: |
            ${{ runner.temp }}/build-chaos/*.log
            ${{ runner.temp }}/build-chaos/check-logs/
          if-no-files-found: ignore

  workers-pkg:
    name: Package suites (${{ matrix.group }}, workers ${{ matrix.mode }})
    needs: [changes, images, linux]
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' && needs.changes.outputs.workers-pkg != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [jsonrpc, treesit, process, files]
        mode: ["on", "off"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: dl
        continue-on-error: true
        with:
          name: tarball-fedora-45
          path: dist
      - name: The fedora-45 build made a tarball
        if: ${{ steps.dl.outcome == 'failure' }}
        run: |
          echo "::error::no tarball: the fedora-45 build job failed (see the Linux fedora-45 job), so there is nothing to test"
          exit 1
      - name: Unpack the tarball at its prefix
        id: unpack
        run: |
          top=$(tar -tJf dist/*.tar.xz | head -n 1 | cut -d/ -f1)
          prefix=$(tar -xJOf dist/*.tar.xz "$top/share/nidhogg/BUILDINFO" | sed -n 's/^prefix=//p')
          sudo mkdir -p "$prefix" && sudo tar -C "$prefix" --strip-components=1 -xJf dist/*.tar.xz
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      # pkg-test.sh's servers and tools and the tarball's run-time packages
      - name: The package suites' image
        uses: ./.github/actions/nh-image
        with:
          name: pkg-fedora-45
          ref: ${{ needs.images.outputs.pkg_fedora_45 }}
          variable: NIDHOGG_PKG_IMAGE
      # the third-party packages' clones (pkg-test.sh checks out each pinned commit, fetching it when missing); what a
      # run makes inside them (vterm's module against this run's Emacs, compiled Lisp) is left out of the saved entry
      # (the paths are the save step's: they are part of the entry's version)
      - name: Pinned packages
        id: pkgs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/pkg-cache
            !${{ runner.temp }}/pkg-cache/*/build
            !${{ runner.temp }}/pkg-cache/**/*.elc
            !${{ runner.temp }}/pkg-cache/**/*.eln
            !${{ runner.temp }}/pkg-cache/**/*.so
          key: pkg-pins-${{ hashFiles('nidhogg/test/pkg-pins.txt', 'nidhogg/test/pkg-test.sh') }}
      - name: ${{ matrix.group }} with the workers ${{ matrix.mode }}
        id: run
        env:
          NIDHOGG_PKG_CACHE: ${{ runner.temp }}/pkg-cache
        run: bash nidhogg/test/pkg-test.sh --container fedora-45 --prefix "${{ steps.unpack.outputs.prefix }}" --mode "${{ matrix.mode }}" --select "${{ matrix.group }}" --out "$RUNNER_TEMP/out"
      - name: Save pinned packages
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.pkgs.outputs.cache-hit != 'true' && steps.run.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/pkg-cache
            !${{ runner.temp }}/pkg-cache/*/build
            !${{ runner.temp }}/pkg-cache/**/*.elc
            !${{ runner.temp }}/pkg-cache/**/*.eln
            !${{ runner.temp }}/pkg-cache/**/*.so
          key: pkg-pins-${{ hashFiles('nidhogg/test/pkg-pins.txt', 'nidhogg/test/pkg-test.sh') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pkg-outcomes-${{ matrix.group }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  workers-pkg-compare:
    name: Package suites, on against off
    needs: [changes, workers-pkg]
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' && needs.changes.outputs.workers-pkg-compare != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-outcomes-*
          merge-multiple: true
          path: outcomes
      - name: A failure only with the workers on fails the gate
        run: bash nidhogg/test/pkg-test.sh --compare outcomes

  # The timing tests in a lane of their own, report-only: it runs nothing else, judges each timing file on the median of 20
  # samples against the runner's own speed (a fixed workload before and after), and never fails the run or the release
  # (continue-on-error, not in release's needs). README.md, "CI and releases".
  timing:
    name: Timing lane, report-only (${{ matrix.name }})
    needs: [changes, images, linux, macos]
    if: ${{ !cancelled() && github.ref_type != 'tag' && needs.changes.outputs.timing != 'false' }}
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fedora-45, runner: ubuntu-24.04, artifact: tarball-fedora-45 }
          - { name: macos, runner: xcode-27, artifact: tarball-macos }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Unpack the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/nidhogg"
          tar -xJf dist/*.tar.xz -C "$RUNNER_TEMP/nidhogg" --strip-components=1
      # the GUI lanes' image: the tarball's run-time packages on the pinned base
      - name: The test image
        if: ${{ matrix.name == 'fedora-45' }}
        uses: ./.github/actions/nh-image
        with:
          name: gui-fedora-45
          ref: ${{ needs.images.outputs.gui_fedora_45 }}
          variable: TIMING_IMAGE
      - name: Timing lane (Linux, in the pinned fedora-45 image)
        if: ${{ matrix.name == 'fedora-45' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          podman run --rm --memory 4g --memory-swap 4g \
            -v "$PWD:/src:ro,z" -v "$RUNNER_TEMP/nidhogg:/nh:ro,z" -v "$RUNNER_TEMP/out:/out:z" \
            "$TIMING_IMAGE" bash -c '
              set -eu
              rt=/nh/share/nidhogg/deps.runtime
              pk=$(sed "s/#.*//" "$rt")
              rpm -q --quiet --whatprovides $pk || dnf -y -q --setopt=install_weak_deps=False install $pk > /tmp/dnf.log 2>&1 || { cat /tmp/dnf.log; exit 1; }
              cd /src && bash nidhogg/test/timing-lane.sh --prefix /nh --report /out/timing.txt'
      - name: Timing lane (macOS)
        if: ${{ matrix.name == 'macos' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          /bin/bash nidhogg/test/timing-lane.sh --prefix "$RUNNER_TEMP/nidhogg" --report "$RUNNER_TEMP/out/timing.txt"
      - name: The verdicts
        if: always()
        run: cat "$RUNNER_TEMP/out/timing.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: timing-${{ matrix.name }}
          path: ${{ runner.temp }}/out/timing.txt
          if-no-files-found: ignore

  # A pull request's cache budget: once the saving jobs are done, the entries an earlier run of this pull request saved
  # are deleted, so its scope holds one run's set (about 0.6-0.9 GB) beside nidhogg-31's.  Housekeeping: not in the
  # gate, and a cancelled run (a newer push) leaves it to the newer run.
  pr-caches:
    name: The pull request keeps one run's caches
    needs: [linux, compile-noglitnir, macos, workers-asan, workers-chaos, workers-pkg]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this pull request's entries from earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          RUN: ${{ github.run_id }}
        run: |
          start=$(gh api "repos/$REPO/actions/runs/$RUN" --jq .run_started_at)
          gh api --paginate "repos/$REPO/actions/caches?ref=$REF&per_page=100" \
            --jq ".actions_caches[] | select(.created_at < \"$start\") | \"\(.id) \(.size_in_bytes) \(.key)\"" > "$RUNNER_TEMP/old"
          while read -r id size key; do
            gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null && echo "deleted $key ($((size / 1048576)) MB)"
          done < "$RUNNER_TEMP/old"
          echo "kept: $(gh api --paginate "repos/$REPO/actions/caches?ref=$REF&per_page=100" --jq '[.actions_caches[].size_in_bytes] | add // 0' | awk '{s += $1} END {printf "%d MB", s / 1048576}')"

  # The run's verdict: every job but the report-only timing lane passed, or was rightly skipped (the changes job said
  # so, or a release tag leaves it to the tagged commit's round).  It always runs, so no check is left pending.  A
  # narrowed run's gate is "Nidhogg gate (partial)": green when what it ran passed, never the full run's check.
  gate:
    name: ${{ needs.changes.outputs.partial == 'true' && 'Nidhogg gate (partial)' || 'Nidhogg gate' }}
    if: always()
    needs: [changes, tree, vendor, fast-forward, linux, compile-noglitnir, macos, pin, drgnx, native-crates, native-gui, workers-harness, workers-asan, workers-chaos, workers-pkg, workers-pkg-compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job passed or was rightly skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIP: ${{ needs.changes.outputs.skip }}
          TAG: ${{ github.ref_type == 'tag' }}
          PR: ${{ github.event_name == 'pull_request' }}
          PARTIAL: ${{ needs.changes.outputs.partial }}
        run: |
          allow=" $SKIP "
          [ "$TAG" != true ] || allow="$allow compile-noglitnir workers-harness workers-asan workers-chaos workers-pkg workers-pkg-compare "
          [ "$PR" = true ] || allow="$allow fast-forward "
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          [ "$PARTIAL" != true ] || echo "::notice::a narrowed run: its gate stands only for the jobs it ran"
          jq -e --arg allow "$allow" \
            'to_entries | all(.value.result == "success" or (.value.result == "skipped" and (.key as $k | $allow | contains(" " + $k + " "))))' \
            <<<"$NEEDS" >/dev/null

  # The vendored crates are not in git: Cargo.lock is the pin, and a release publishes nidhogg-vendor-<version>.tar.zst
  # (shell/vendor, glitnir/vendor and the .cargo/config.toml files that point cargo at them, to unpack in nidhogg/), for
  # offline builds and for distro packagers.  Every run builds it from the locks (the build fails when a lock would
  # change) and checks it against them (ci/vendor.sh), so a lock that cannot be vendored is caught before a release.
  # It reads the public registry only: no token, no credentials, read-only permissions.
  vendor:
    name: Vendored crates (the tarball matches the locks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: The crates the locks pin (registry index and .crate files only)
        id: vcrates
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/vendor-cargo/registry/index
            ${{ runner.temp }}/vendor-cargo/registry/cache
          key: vendor-crates-${{ hashFiles('nidhogg/shell/Cargo.lock', 'nidhogg/glitnir/Cargo.lock') }}
      - name: Build the tarball and check it against the locks
        env:
          CARGO_HOME: ${{ runner.temp }}/vendor-cargo
        run: |
          cargo install cargo-vendor-filterer --locked
          export PATH="$CARGO_HOME/bin:$PATH"
          V=$(head -n 1 nidhogg/version)
          bash nidhogg/ci/vendor.sh make "dist/nidhogg-vendor-$V.tar.zst"
          bash nidhogg/ci/vendor.sh check "dist/nidhogg-vendor-$V.tar.zst"
      - name: Save the crates
        if: ${{ !cancelled() && env.CACHE_SAVE == 'true' && steps.vcrates.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/vendor-cargo/registry/index
            ${{ runner.temp }}/vendor-cargo/registry/cache
          key: vendor-crates-${{ hashFiles('nidhogg/shell/Cargo.lock', 'nidhogg/glitnir/Cargo.lock') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-crates
          path: dist/nidhogg-vendor-*.tar.zst

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tree, vendor, linux, macos, drgnx, native-crates, native-gui]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendor-crates
          path: dist
      - name: The tag is v<nidhogg/version>
        run: test "$GITHUB_REF_NAME" = "v$(head -n 1 nidhogg/version)"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRGNX_COMMIT: ${{ needs.drgnx.outputs.drgnx_commit }}
        run: |
          V=$(head -n 1 nidhogg/version)
          cd dist
          sha256sum -- *.tar.xz *.tar.zst > SHA256SUMS
          commit=$(tar -xJOf "$(ls -- *fedora-45*.tar.xz)" "nidhogg-$V/share/nidhogg/BUILDINFO" | sed -n 's/^commit=//p')
          printf 'Nidhogg %s, built from commit %s.\n\nThe native shell'"'"'s crate checks and GUI rows passed on this build.  drgnx tiers passed on it against drgnx commit %s: the unit suite and gate mode, the GUI tier (Linux), the unit suite (macOS).\n' \
            "$V" "$commit" "$DRGNX_COMMIT" > ../notes.md
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --title "Nidhogg $V" --notes-file notes.md
