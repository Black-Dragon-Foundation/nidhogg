# Nidhogg CI.  Every build goes through nidhogg/build.sh (podman containers on Linux, the host on macOS).  drgnx's tiers
# (its own drgnx-tiers.yml, called here) run against the built tarballs and gate the release job.  README.md, "CI and
# releases".
name: Nidhogg

on:
  push:
    branches: [nidhogg-31]
    tags: ["v*-nidhogg.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      drgnx_ref:
        description: "drgnx branch, tag or commit whose unit suite runs against the build (empty: the pinned commit)"
        default: ""
      scope:
        description: "full: every job; macos: the series rules and the macOS jobs only (between gates, Linux is tested locally)"
        type: choice
        options: [full, macos]
        default: full

permissions:
  contents: read

concurrency:
  group: nidhogg-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tree:
    name: Patch series rules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y unifdef
      - run: TREE_TEST_SELF=1 bash nidhogg/test/tree-test.sh
      - run: bash nidhogg/test/tree-test.sh
      - run: bash nidhogg/test/ci-test.sh
      - run: bash nidhogg/test/check-rerun-test.sh
      - run: bash nidhogg/test/preflight-test.sh
      - run: bash nidhogg/test/timing-lane.sh --self-test
      # Glitnir (the compositor): the crate's checks (fmt, clippy, tests, licences, vendor drift) and the advisories.
      - name: Glitnir's checks
        run: |
          sudo apt-get update && sudo apt-get install -y libpixman-1-dev
          d="cargo-deny-0.20.2-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/cd.tgz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$d.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cd.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/cd.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 "$d/cargo-deny"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          bash nidhogg/glitnir/check.sh
          cd nidhogg/glitnir && cargo deny check advisories

  linux:
    name: Linux (${{ matrix.distro }})
    if: ${{ inputs.scope != 'macos' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora-44, fedora-45, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches are restored before the build and saved right after it (actions/cache/save), not at the end of the job: a
      # later failing step (the tarball test) keeps what the build produced.  Every key is identical on every branch, so a
      # run on a ci/* branch or a pull request restores what nidhogg-31 (the default branch) saved.  Only nidhogg-31 saves:
      # an identical key saved again per ref would count against the repository's cache limit once per ref.  README.md,
      # "CI and releases".
      - name: Source tree hash, compiled-Lisp inputs, file times
        id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "lisp=$(bash nidhogg/ci/lisp-key.sh)" >> "$GITHUB_OUTPUT"
          bash nidhogg/ci/set-mtimes.sh
      # The built tarball, keyed by the exact source tree (git's tree hash of HEAD), the distro and build.sh: an
      # unchanged tree reuses its tarball (saved only after the build and Emacs's checks passed) and the tarball test, the
      # artifact upload and drgnx's suite still run.  Never for a release tag: a release is built fresh, so its BUILDINFO
      # names the tagged commit.
      - name: Built tarball (same tree, same build.sh)
        id: tb
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: tarball-${{ matrix.distro }}-${{ steps.tree.outputs.tree }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The cached tarball is intact
        if: ${{ steps.tb.outputs.cache-hit == 'true' }}
        run: cd dist && sha256sum -c -- *.sha256
      # ccache for the C compile.  ccache hashes the preprocessed source and checks the compiler by content (build.sh), so
      # a restored entry can only be a correct one; the key carries the distro, the compiler's package set (gcc, from the
      # build dependency list) and the series commit, the fallback everything but the commit.
      - name: ccache (C objects)
        id: cc
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.distro }}-gcc-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.distro }}-gcc-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}-
      - name: Package download cache (dnf, apt)
        id: pk
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pkg-cache
          key: pkgs-${{ matrix.distro }}-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}
          restore-keys: pkgs-${{ matrix.distro }}-
      # The build's compiled Lisp (generated files under lisp/, .elc, .eln): exact key only.  The Lisp compile is the
      # dominant cost, the ccache above does not touch it, and a partly stale set would not be rebuilt correctly.  Keyed
      # by the Lisp and C-side inputs (nidhogg/ci/lisp-key.sh: .eln files embed the Emacs build's ABI hash, which the C
      # side determines), build.sh (the configure flags) and the distro; build.sh also refuses an entry made by another gcc.
      - name: Compiled Lisp (same Lisp and C sources)
        id: lc
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-${{ matrix.distro }}-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}-${{ steps.tree.outputs.lisp }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Build
        id: build
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        env:
          NIDHOGG_BUILD_PKG_CACHE: ${{ runner.temp }}/pkg-cache
          NIDHOGG_BUILD_CCACHE: ${{ runner.temp }}/ccache
          NIDHOGG_BUILD_LISP_CACHE: ${{ runner.temp }}/lisp-cache
        run: |
          bash nidhogg/build.sh --container "${{ matrix.distro }}" --stage build --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build"
      # saved right after the build, before Emacs's checks and the tarball (a build that failed saves nothing); an entry whose key was found is not saved again
      - name: Save ccache
        if: ${{ always() && github.ref == 'refs/heads/nidhogg-31' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.distro }}-gcc-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}-${{ github.sha }}
      - name: Save package downloads
        if: ${{ always() && github.ref == 'refs/heads/nidhogg-31' && steps.build.outcome == 'success' && steps.pk.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pkg-cache
          key: pkgs-${{ matrix.distro }}-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}
      - name: Save compiled Lisp
        if: ${{ always() && github.ref == 'refs/heads/nidhogg-31' && steps.build.outcome == 'success' && steps.lc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-${{ matrix.distro }}-${{ hashFiles(format('nidhogg/deps/{0}.build', matrix.distro)) }}-${{ steps.tree.outputs.lisp }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Emacs's checks (nidhogg/check-subset.txt)
        id: check
        if: ${{ steps.build.outcome == 'success' }}
        env:
          NIDHOGG_BUILD_PKG_CACHE: ${{ runner.temp }}/pkg-cache
        run: bash nidhogg/build.sh --container "${{ matrix.distro }}" --stage check --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build" --check nidhogg/check-subset.txt
      - name: Write the tarball
        id: pack
        if: ${{ steps.check.outcome == 'success' }}
        env:
          NIDHOGG_BUILD_PKG_CACHE: ${{ runner.temp }}/pkg-cache
        run: |
          V=$(head -n 1 nidhogg/version)
          bash nidhogg/build.sh --container "${{ matrix.distro }}" --stage pack --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build" \
            --out "dist/nidhogg-$V-${{ matrix.distro }}-$(uname -m).tar.xz"
      - name: Save built tarball
        if: ${{ always() && github.ref == 'refs/heads/nidhogg-31' && steps.pack.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: tarball-${{ matrix.distro }}-${{ steps.tree.outputs.tree }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The tarball runs at its prefix and elsewhere
        run: bash nidhogg/test/tarball-test.sh dist/*.tar.xz "${{ matrix.distro }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.distro }}
          path: dist/
          if-no-files-found: error
      - name: Build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ matrix.distro }}
          path: ${{ runner.temp }}/build/*.log
          if-no-files-found: ignore

  # Glitnir (the compositor) is behind --with-glitnir: the tree still configures and compiles without it, with no
  # Rust installed (build.sh leaves cargo and rust out of the package list under --without-glitnir).
  compile-noglitnir:
    name: Compile without Glitnir (fedora-44)
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: bash nidhogg/build.sh --container fedora-44 --without-glitnir --stage build --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build"

  macos:
    name: macOS (NS app)
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the same caches and keys as the Linux jobs (see there), saved right after the step that produced them
      - name: Source tree hash, compiled-Lisp inputs, file times
        id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "lisp=$(bash nidhogg/ci/lisp-key.sh)" >> "$GITHUB_OUTPUT"
          bash nidhogg/ci/set-mtimes.sh
      - name: Built tarball (same tree, same build.sh)
        id: tb
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: tarball-macos-${{ runner.arch }}-${{ steps.tree.outputs.tree }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The cached tarball is intact
        if: ${{ steps.tb.outputs.cache-hit == 'true' }}
        run: shasum -a 256 -c dist/*.sha256
      # Homebrew's downloads (bottles), which brew checks against their checksums
      - name: Homebrew cache path
        id: brewdir
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        run: echo "dir=$(brew --cache)/downloads" >> "$GITHUB_OUTPUT"
      - name: Homebrew downloads
        id: bd
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.brewdir.outputs.dir }}
          key: brew-macos-${{ runner.arch }}-${{ hashFiles('nidhogg/deps/macos.build') }}
          restore-keys: brew-macos-${{ runner.arch }}-
      - name: Build dependencies (Homebrew)
        id: brew
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        run: sed 's/#.*//' nidhogg/deps/macos.build | xargs brew install
      - name: Save Homebrew downloads
        if: ${{ always() && github.ref == 'refs/heads/nidhogg-31' && steps.brew.outcome == 'success' && steps.bd.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.brewdir.outputs.dir }}
          key: brew-macos-${{ runner.arch }}-${{ hashFiles('nidhogg/deps/macos.build') }}
      # Glitnir (the compositor): the crate's tests with Homebrew's rust (cargo, clippy, rustfmt; no pixman, the oracle is
      # Linux only; no cargo-deny, check.sh skips the licence check without it), so the aarch64 NEON baseline kernels are
      # tested somewhere.  Skipped with the build when the tarball for this tree is cached (it was built after these passed).
      - name: Glitnir's checks
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: bash nidhogg/glitnir/check.sh
      # compiled Lisp: also keyed by the installed gcc and libgccjit versions and the build path (.eln names embed it)
      - name: Toolchain versions
        id: tc
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        run: echo "v=$(brew list --versions gcc libgccjit | tr ' \n' '--')" >> "$GITHUB_OUTPUT"
      - name: Compiled Lisp (same Lisp and C sources)
        id: lc
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-macos-${{ runner.arch }}-${{ steps.tc.outputs.v }}-${{ runner.temp }}-${{ steps.tree.outputs.lisp }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Build
        id: build
        if: ${{ steps.tb.outputs.cache-hit != 'true' }}
        env:
          NIDHOGG_BUILD_LISP_CACHE: ${{ runner.temp }}/lisp-cache
        run: /bin/bash nidhogg/build.sh --host --stage build --jobs 3 --build-dir "$RUNNER_TEMP/build"
      - name: Save compiled Lisp
        if: ${{ always() && github.ref == 'refs/heads/nidhogg-31' && steps.build.outcome == 'success' && steps.lc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lisp-cache
          key: lisp-macos-${{ runner.arch }}-${{ steps.tc.outputs.v }}-${{ runner.temp }}-${{ steps.tree.outputs.lisp }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: Write the tarball
        id: pack
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          V=$(head -n 1 nidhogg/version)
          /bin/bash nidhogg/build.sh --host --stage pack --jobs 3 --build-dir "$RUNNER_TEMP/build" --out "dist/nidhogg-$V-macos-$(uname -m).tar.xz"
      - name: Save built tarball
        if: ${{ always() && github.ref == 'refs/heads/nidhogg-31' && steps.pack.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: tarball-macos-${{ runner.arch }}-${{ steps.tree.outputs.tree }}-${{ hashFiles('nidhogg/build.sh') }}
      - name: The tarball runs unpacked
        run: bash nidhogg/test/tarball-test.sh dist/*.tar.xz macos
      # the workers batch files of nidhogg/check-subset.txt (Task 37); a cached tarball has no build tree to check
      - name: Workers checks (nidhogg/check-subset.txt, workers-* files)
        if: ${{ steps.build.outcome == 'success' }}
        run: |
          grep 'nidhogg-tests/workers-' nidhogg/check-subset.txt > "$RUNNER_TEMP/macos-subset.txt"
          /bin/bash nidhogg/build.sh --host --stage check --jobs 3 --build-dir "$RUNNER_TEMP/build" --check "$RUNNER_TEMP/macos-subset.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-macos
          path: dist/
          if-no-files-found: error
      - name: Build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-macos
          path: ${{ runner.temp }}/build/*.log
          if-no-files-found: ignore

  # drgnx's Emacs-side tiers on the tarballs this run built, through drgnx's own definition of them
  # (.github/workflows/drgnx-tiers.yml in drgnx), called at a pinned drgnx commit, so a drgnx push never turns Nidhogg
  # red.  The uses line below is the one place the pin lives: GitHub allows no expression there, so the pin job reads
  # the SHA from it and the default drgnx_ref is that output.  Bump the uses line by hand to a drgnx commit whose CI is
  # green, and pass drgnx_ref by hand for a joint round (README.md, "CI and releases").  The
  # unit suite and gate mode on the fedora-45 tarball, the GUI tier on it under headless mutter, the unit suite on the
  # macOS tarball (only that one in scope=macos).  It runs once the builds are done, whatever they did: a job whose
  # tarball is missing fails by itself.
  pin:
    name: drgnx pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: The drgnx commit the uses line pins
        id: pin
        run: |
          ref=$(grep -oE '^ {4}uses:[ ]Black-Dragon-Foundation/drgnx/\.github/workflows/drgnx-tiers\.yml@[0-9a-f]{40}' .github/workflows/build.yml | sed 's/.*@//')
          [ -n "$ref" ] || { echo "no pinned drgnx-tiers.yml in build.yml" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  drgnx:
    name: drgnx tiers
    needs: [pin, linux, macos]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: read
    uses: Black-Dragon-Foundation/drgnx/.github/workflows/drgnx-tiers.yml@4353f1fa51e054c3078474e686d981aeb2348aec # drgnx pin
    with:
      drgnx_ref: ${{ inputs.drgnx_ref || needs.pin.outputs.ref }}
      nidhogg: artifact
      tiers: ${{ inputs.scope == 'macos' && 'macos' || 'unit no-lisp-writes ui macos' }}

  # GUI tests (test/src/nidhogg-tests/*-gui-tests.el): the fedora-45 tarball, a pgtk build, in a fedora-45 container on a
  # headless sway (gui.sh's default) with its own session bus, at monitor scale 1 and 2 (nidhogg/test/gui.sh).  The
  # native shell's rows skip here: native-gui runs them.  Not part of the release gate.
  gui:
    name: GUI tests (pgtk, headless sway, scale ${{ matrix.scale }})
    needs: linux
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scale: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: dl
        continue-on-error: true
        with:
          name: tarball-fedora-45
          path: dist
      - name: The fedora-45 build made a tarball
        if: ${{ steps.dl.outcome == 'failure' }}
        run: |
          echo "::error::no tarball: the fedora-45 build job failed (see the Linux fedora-45 job), so there is nothing to test"
          exit 1
      - name: Unpack the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/nidhogg"
          tar -xJf dist/*.tar.xz -C "$RUNNER_TEMP/nidhogg" --strip-components=1
      - name: GUI tests at scale ${{ matrix.scale }}
        run: bash nidhogg/test/gui.sh --prefix "$RUNNER_TEMP/nidhogg" --scale "${{ matrix.scale }}" --container fedora-45 --timeout 1800

  # The native Wayland shell.  Every tarball above is pgtk (build.sh's default), so it gets a build of its own, the
  # recorder its rows need, its crates' checks, and its GUI rows on the recorder and on real compositors
  # (nidhogg/test/native-gui.sh).  None is in release's needs and none runs for a release tag, like gui.
  native:
    name: Native shell build (fedora-45)
    if: ${{ inputs.scope != 'macos' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash nidhogg/ci/set-mtimes.sh
      - name: ccache (C objects)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-native-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ github.sha }}
          restore-keys: ccache-native-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-
      - name: Build and pack
        id: build
        env:
          NIDHOGG_BUILD_CCACHE: ${{ runner.temp }}/ccache
        run: |
          bash nidhogg/build.sh --container fedora-45 --nidhogg-wayland --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build" \
            --out "dist/nidhogg-native-fedora-45-$(uname -m).tar.xz"
      - name: Save ccache
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-native-${{ hashFiles('nidhogg/deps/fedora-45.build') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-native
          path: dist/
          if-no-files-found: error

  # The recorder, then the crates' checks, which need it: their T1 tests run against it, and nothing else in this
  # workflow runs them (the build compiles the crates, and only Glitnir's checks run in tree).
  native-crates:
    name: Native shell crates (recorder, shell, glue)
    if: ${{ inputs.scope != 'macos' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: T="$RUNNER_TEMP" bash nidhogg/test/recorder/check.sh --container fedora-45 --build
      - run: T="$RUNNER_TEMP" NH_RECORDER="$RUNNER_TEMP/nh-recorder-target/release/nh-recorder" bash nidhogg/shell/check.sh --container fedora-45
      - run: T="$RUNNER_TEMP" NH_RECORDER="$RUNNER_TEMP/nh-recorder-target/release/nh-recorder" bash nidhogg/glue/check.sh --container fedora-45
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nh-recorder
          path: ${{ runner.temp }}/nh-recorder-target/release/nh-recorder
          if-no-files-found: error

  native-gui:
    name: Native GUI rows (${{ matrix.lane }})
    needs: [native, native-crates]
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [recorder, recorder-mutter, recorder-inline, mutter, sway, decor-recorder, decor-1, decor-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-native
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nh-recorder
          path: recorder
      - name: Unpack
        run: |
          mkdir -p "$RUNNER_TEMP/nidhogg"
          tar -xJf dist/*.tar.xz -C "$RUNNER_TEMP/nidhogg" --strip-components=1
          chmod +x recorder/nh-recorder
      - run: bash nidhogg/test/native-gui.sh "${{ matrix.lane }}" --prefix "$RUNNER_TEMP/nidhogg" --recorder "$PWD/recorder/nh-recorder" --container fedora-45

  # The off-main-thread work's CI (engine C, PD-4).  They run once the Linux builds are done, whatever the other distros
  # did, and they are not in release's needs: the default-on rule requires them green on the gate commit, a release
  # does not wait for them.  None of them has fail-fast.  Like gui and compile-noglitnir, none runs for a release tag:
  # the tagged commit passed them in its round (README.md, "CI and releases").
  workers-harness:
    name: Workers C harness (TSan, fuzz)
    needs: linux
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ThreadSanitizer drivers and fuzz targets, in a fedora-45 container
        run: |
          podman run --rm --memory 8g --memory-swap 8g -v "$PWD:/src:ro,Z" registry.fedoraproject.org/fedora:45 bash -euo pipefail -c '
            dnf -y -q --setopt=install_weak_deps=False install gcc libtsan libasan libubsan \
              libpng-devel libjpeg-turbo-devel giflib-devel libwebp-devel >/dev/null
            cd /src
            bash nidhogg/test/workers-harness.sh
            bash nidhogg/test/workers-harness.sh --tsan $(cd test/src/nidhogg-tests/fuzz && ls tsan-*.c | sed "s/^tsan-//; s/[.]c$//")
            bash nidhogg/test/workers-harness.sh --fuzz 60'

  workers-asan:
    name: Workers batch files (ASan + UBSan dev build)
    needs: linux
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every workers-*-tests batch file but the timing and GUI groups
        run: |
          ls test/src/nidhogg-tests/workers-*-tests.el | sed 's|^test/||; s|[.]el$||' | grep -v -e -timing- -e -gui- > "$RUNNER_TEMP/asan-subset.txt"
          cat "$RUNNER_TEMP/asan-subset.txt"
      - name: "Build and run (the 100 MB-class rows are sized down: nidhogg-workers--test-size-scale)"
        env:
          NIDHOGG_BUILD_SANITIZE: address,undefined
          NIDHOGG_WORKERS_TEST_SIZE_SCALE: "0.1"
        run: |
          bash nidhogg/build.sh --container fedora-45 --dev --memory 12g --jobs 4 --build-dir "$RUNNER_TEMP/build-asan" \
            --check "$RUNNER_TEMP/asan-subset.txt"
      - name: Build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-workers-asan
          path: ${{ runner.temp }}/build-asan/*.log
          if-no-files-found: ignore

  workers-pkg:
    name: Package suites (${{ matrix.group }}, workers ${{ matrix.mode }})
    needs: linux
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [jsonrpc, treesit, process, files]
        mode: ["on", "off"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: dl
        continue-on-error: true
        with:
          name: tarball-fedora-45
          path: dist
      - name: The fedora-45 build made a tarball
        if: ${{ steps.dl.outcome == 'failure' }}
        run: |
          echo "::error::no tarball: the fedora-45 build job failed (see the Linux fedora-45 job), so there is nothing to test"
          exit 1
      - name: Unpack the tarball at its prefix
        id: unpack
        run: |
          top=$(tar -tJf dist/*.tar.xz | head -n 1 | cut -d/ -f1)
          prefix=$(tar -xJOf dist/*.tar.xz "$top/share/nidhogg/BUILDINFO" | sed -n 's/^prefix=//p')
          sudo mkdir -p "$prefix" && sudo tar -C "$prefix" --strip-components=1 -xJf dist/*.tar.xz
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: ${{ matrix.group }} with the workers ${{ matrix.mode }}
        env:
          NIDHOGG_PKG_CACHE: ${{ runner.temp }}/pkg-cache
        run: bash nidhogg/test/pkg-test.sh --container fedora-45 --prefix "${{ steps.unpack.outputs.prefix }}" --mode "${{ matrix.mode }}" --select "${{ matrix.group }}" --out "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pkg-outcomes-${{ matrix.group }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

  workers-pkg-compare:
    name: Package suites, on against off
    needs: workers-pkg
    if: ${{ !cancelled() && inputs.scope != 'macos' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-outcomes-*
          merge-multiple: true
          path: outcomes
      - name: A failure only with the workers on fails the gate
        run: bash nidhogg/test/pkg-test.sh --compare outcomes

  # The timing tests in a lane of their own, report-only: it runs nothing else, judges each timing file on the median of 20
  # samples against the runner's own speed (a fixed workload before and after), and never fails the run or the release
  # (continue-on-error, not in release's needs). README.md, "CI and releases".
  timing:
    name: Timing lane, report-only (${{ matrix.name }})
    needs: [linux, macos]
    if: ${{ !cancelled() && github.ref_type != 'tag' }}
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fedora-45, runner: ubuntu-24.04, artifact: tarball-fedora-45 }
          - { name: macos, runner: xcode-27, artifact: tarball-macos }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Unpack the tarball
        run: |
          mkdir -p "$RUNNER_TEMP/nidhogg"
          tar -xJf dist/*.tar.xz -C "$RUNNER_TEMP/nidhogg" --strip-components=1
      - name: Timing lane (Linux, in the pinned fedora-45 image)
        if: ${{ matrix.name == 'fedora-45' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          podman run --rm --memory 4g --memory-swap 4g \
            -v "$PWD:/src:ro,z" -v "$RUNNER_TEMP/nidhogg:/nh:ro,z" -v "$RUNNER_TEMP/out:/out:z" \
            registry.fedoraproject.org/fedora@sha256:6430abb162172c052b6ac9c9d6a219b1b21352508c04b1b0ff2eb9292943d881 bash -c '
              set -eu
              rt=/nh/share/nidhogg/deps.runtime
              dnf -y -q --setopt=install_weak_deps=False install $(sed "s/#.*//" "$rt") > /tmp/dnf.log 2>&1 || { cat /tmp/dnf.log; exit 1; }
              cd /src && bash nidhogg/test/timing-lane.sh --prefix /nh --report /out/timing.txt'
      - name: Timing lane (macOS)
        if: ${{ matrix.name == 'macos' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          /bin/bash nidhogg/test/timing-lane.sh --prefix "$RUNNER_TEMP/nidhogg" --report "$RUNNER_TEMP/out/timing.txt"
      - name: The verdicts
        if: always()
        run: cat "$RUNNER_TEMP/out/timing.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: timing-${{ matrix.name }}
          path: ${{ runner.temp }}/out/timing.txt
          if-no-files-found: ignore

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tree, linux, macos, drgnx]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: The tag is v<nidhogg/version>
        run: test "$GITHUB_REF_NAME" = "v$(head -n 1 nidhogg/version)"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRGNX_COMMIT: ${{ needs.drgnx.outputs.drgnx_commit }}
        run: |
          V=$(head -n 1 nidhogg/version)
          cd dist
          sha256sum -- *.tar.xz > SHA256SUMS
          commit=$(tar -xJOf "$(ls -- *fedora-45*.tar.xz)" "nidhogg-$V/share/nidhogg/BUILDINFO" | sed -n 's/^commit=//p')
          printf 'Nidhogg %s, built from commit %s.\n\ndrgnx tiers passed on this build against drgnx commit %s: the unit suite and gate mode, the GUI tier (Linux), the unit suite (macOS).\n' \
            "$V" "$commit" "$DRGNX_COMMIT" > ../notes.md
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --title "Nidhogg $V" --notes-file notes.md
